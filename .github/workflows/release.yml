name: Release

# Every push to main checks the code, builds the four executables plus a double-click bundle
# per system, and publishes them as a new release, bumping the patch number from the last
# release tag: v0.0.1, v0.0.2, ...
on:
  push:
    branches: [main]

permissions:
  contents: write # to create the release and its tag

# One release at a time, so two quick pushes can't claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag, to find the last version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Pick the next version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then
            next=0.0.1
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Last release: ${last:-none}. This one: v$next"
          echo "number=$next" >> "$GITHUB_OUTPUT"

      - name: Check the code
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun handoff.ts
          git diff --exit-code output/ # the committed output files must match what the code produces

      - name: Build the executables
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          echo "export const VERSION = \"$VERSION\";" > version.ts
          bun run build
          ./dist/handoff-linux-x64 --version
          ./dist/handoff-linux-x64
          git diff --exit-code output/ # the Linux executable gives the same results

      # Bun gives the Apple-chip Mac executable a fresh signature, but the Intel one keeps Bun's
      # own signature, which stops matching once our code is inside, so macOS refuses to open the
      # download at all. Re-sign it ad hoc like the Apple-chip one (no Apple account needed), so
      # the usual Open Anyway step works. rcodesign can sign Mac executables on Linux.
      - name: Sign the Intel Mac executable
        run: |
          version=0.29.0
          sha256=dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002 # of its Linux download
          name="apple-codesign-$version-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$version/$name.tar.gz"
          echo "$sha256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$name/rcodesign" sign dist/handoff-macos-x64

      # A bundle per system: a folder with the program, a copy of the starter pack and a short
      # README, so it can be downloaded, unzipped and double-clicked.
      - name: Package the download bundles
        run: |
          mkdir bundles
          for platform in windows-x64 macos-arm64 macos-x64 linux-x64; do
            folder="bundles/handoff-$platform"
            mkdir "$folder"
            if [ "$platform" = windows-x64 ]; then
              cp dist/handoff-windows-x64.exe "$folder/handoff.exe"
            else
              cp "dist/handoff-$platform" "$folder/handoff"
              chmod +x "$folder/handoff"
            fi
            cp -r starter_pack "$folder/"
            cp packaging/README.txt "$folder/"
          done
          cd bundles
          # zip for Windows and Mac, which open it with a double-click; tar.gz keeps Linux's run permission
          for platform in windows-x64 macos-arm64 macos-x64; do zip -qr "handoff-$platform.zip" "handoff-$platform"; done
          tar -czf handoff-linux-x64.tar.gz handoff-linux-x64
          ls -l *.zip *.tar.gz

      - name: Test the Linux bundle from another folder
        run: |
          mkdir /tmp/try
          tar -xzf bundles/handoff-linux-x64.tar.gz -C /tmp/try
          cd / && /tmp/try/handoff-linux-x64/handoff # started from /, it must still find its own starter_pack
          diff -r /tmp/try/handoff-linux-x64/output "$GITHUB_WORKSPACE/output"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.number }}
        run: |
          gh release create "$TAG" dist/* bundles/*.zip bundles/*.tar.gz \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
